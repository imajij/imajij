<svg viewBox="0 0 1000 260" width="1000" height="260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02060b"/>
      <stop offset="0.65" stop-color="#071b21"/>
      <stop offset="1" stop-color="#0e2930"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#sky)"/>

  <!-- synthwave perspective grid -->
  <g stroke="#2dd4bf" stroke-width="1">
    <line x1="0" y1="206" x2="1000" y2="206" opacity="0.16"/>
    <line x1="0" y1="214" x2="1000" y2="214" opacity="0.13"/>
    <line x1="0" y1="224" x2="1000" y2="224" opacity="0.11"/>
    <line x1="0" y1="237" x2="1000" y2="237" opacity="0.09"/>
    <line x1="0" y1="252" x2="1000" y2="252" opacity="0.07"/>
    <g opacity="0.10">
      <line x1="500" y1="200" x2="500" y2="260"/>
      <line x1="500" y1="200" x2="380" y2="260"/>
      <line x1="500" y1="200" x2="260" y2="260"/>
      <line x1="500" y1="200" x2="120" y2="260"/>
      <line x1="500" y1="200" x2="-60" y2="260"/>
      <line x1="500" y1="200" x2="620" y2="260"/>
      <line x1="500" y1="200" x2="740" y2="260"/>
      <line x1="500" y1="200" x2="880" y2="260"/>
      <line x1="500" y1="200" x2="1060" y2="260"/>
    </g>
  </g>

  <!-- stars -->
  <g fill="#e2e8f0">
    <circle cx="40" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="120" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="22" r="1.6"><animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle cx="215" cy="66" r="1.0" opacity="0.7"/>
    <circle cx="268" cy="150" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" begin="1.1s"/></circle>
    <circle cx="322" cy="34" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="378" cy="70" r="1.0" opacity="0.6"/>
    <circle cx="432" cy="26" r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="505" cy="52" r="1.1" opacity="0.75"/>
    <circle cx="560" cy="24" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite" begin="0.2s"/></circle>
    <circle cx="614" cy="88" r="1.0" opacity="0.6"/>
    <circle cx="662" cy="40" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="713" cy="132" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.2s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="768" cy="26" r="1.1" opacity="0.7"/>
    <circle cx="808" cy="96" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="948" cy="140" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.0s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="975" cy="30" r="1.1" opacity="0.65"/>
    <circle cx="60" cy="180" r="1.0" opacity="0.5"/>
    <circle cx="906" cy="188" r="1.0" opacity="0.5"/>
    <circle cx="484" cy="112" r="0.9" opacity="0.5"/>
  </g>

  <!-- shooting star -->
  <g opacity="0">
    <line x1="0" y1="0" x2="46" y2="-14" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="980,40; 640,150" dur="6s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.02;0.08;0.16;1" dur="6s" begin="2s" repeatCount="indefinite"/>
  </g>

  <!-- ringed planet -->
  <g transform="translate(872,58)">
    <circle r="30" fill="#0e2930" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M -30 0 A 30 30 0 0 1 30 0" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="-9" cy="-8" r="4.5" fill="#123a42"/>
    <circle cx="12" cy="6" r="3" fill="#123a42"/>
    <ellipse rx="52" ry="12" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.6" transform="rotate(-16)"/>
  </g>

  <!-- UFO with abduction beam -->
  <g transform="translate(150,74)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="5.5s" repeatCount="indefinite"/>
      <polygon points="-17,12 17,12 54,116 -54,116" fill="url(#beam)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
      </polygon>
      <text x="0" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#a5f3fc" filter="url(#softglow)">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0 34; 0 -20" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.75;1" dur="4.5s" repeatCount="indefinite"/>
      </text>
      <ellipse cx="0" cy="-6" rx="20" ry="15" fill="#0b2229" stroke="#67e8f9" stroke-width="1.6"/>
      <ellipse cx="0" cy="4" rx="48" ry="13" fill="#0e2930" stroke="#22d3ee" stroke-width="1.8" filter="url(#softglow)"/>
      <circle cx="-28" cy="6" r="2.6" fill="#22d3ee"><animate attributeName="fill" values="#22d3ee;#0e2930;#22d3ee" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="-9" cy="8.5" r="2.6" fill="#0e2930"><animate attributeName="fill" values="#0e2930;#22d3ee;#0e2930" dur="1.2s" repeatCount="indefinite" begin="0.3s"/></circle>
      <circle cx="9" cy="8.5" r="2.6" fill="#22d3ee"><animate attributeName="fill" values="#22d3ee;#0e2930;#22d3ee" dur="1.2s" repeatCount="indefinite" begin="0.6s"/></circle>
      <circle cx="28" cy="6" r="2.6" fill="#0e2930"><animate attributeName="fill" values="#0e2930;#22d3ee;#0e2930" dur="1.2s" repeatCount="indefinite" begin="0.9s"/></circle>
    </g>
  </g>

  <!-- fighter jet flyby -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-160 178; 1160 166" dur="12s" repeatCount="indefinite"/>
    <g transform="rotate(-2)">
      <line x1="-96" y1="13" x2="0" y2="13" stroke="url(#trail)" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
      <polygon points="3,10.4 -15,13 3,15.6" fill="#fb923c" filter="url(#softglow)">
        <animate attributeName="points" values="3,10.4 -15,13 3,15.6; 3,10.8 -24,13 3,15.2; 3,10.4 -15,13 3,15.6" dur="0.32s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="3,11.6 -8,13 3,14.4" fill="#fde68a">
        <animate attributeName="opacity" values="1;0.5;1" dur="0.22s" repeatCount="indefinite"/>
      </polygon>
      <path d="M 96 13 L 74 8.6 L 60 8 L 46 8 L 39 1.5 L 33.5 3.5 L 38.5 8.4 L 12 10.4 L 3 13 L 12 15.6 L 38.5 17.6 L 29 24.5 L 35.5 24.9 L 46 18 L 60 18 L 74 17.4 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="0.8"/>
      <path d="M 78 9.6 L 70 8.9 L 65 9.6 L 71 11 Z" fill="#22d3ee" filter="url(#softglow)"/>
      <circle cx="52" cy="13" r="1.3" fill="#0e2930"/>
    </g>
  </g>

  <!-- title -->
  <text x="500" y="84" text-anchor="middle" font-size="12" letter-spacing="7" fill="#2dd4bf" opacity="0.85">// MISSION CONTROL //</text>
  <text x="500" y="130" text-anchor="middle" font-size="52" font-weight="700" letter-spacing="12" fill="#22d3ee" opacity="0.55" filter="url(#glow)">AJIJ UTTAM</text>
  <text x="500" y="130" text-anchor="middle" font-size="52" font-weight="700" letter-spacing="12" fill="#e8fdff">AJIJ UTTAM</text>
  <text x="500" y="160" text-anchor="middle" font-size="14" letter-spacing="4" fill="#67e8f9">SOFTWARE ENGINEER — RUST · AI INFRA · FULL-STACK</text>

  <!-- status readouts -->
  <text x="18" y="246" font-size="10" letter-spacing="2" fill="#2dd4bf" opacity="0.8">SYS ▮ ONLINE
    <animate attributeName="opacity" values="0.8;0.25;0.8" dur="1.6s" repeatCount="indefinite"/>
  </text>
  <text x="982" y="246" text-anchor="end" font-size="10" letter-spacing="2" fill="#2dd4bf" opacity="0.7">BASE: BENGALURU // IN</text>
</svg>
