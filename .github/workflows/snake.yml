# Save as: .github/workflows/snake.yml  (in the imajij/imajij repo)
# Then run it once manually: Actions tab → "generate contribution snake" → Run workflow.
# It regenerates daily and publishes github-snake.svg to the `output` branch.

name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate themed snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#22d3ee&color_dots=#0b1a20,#0e3a3f,#14666a,#1ba7ab,#22d3ee

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
